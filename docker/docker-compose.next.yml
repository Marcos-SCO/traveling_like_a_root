services:
  next:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Next

    working_dir: /next

    volumes:
      - ../next:/next
      - next_node_modules:/next/node_modules

    ports:
      - "5000:5000"

    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 5000"

    networks:
      - traveling_like_a_root

volumes:
  next_node_modules:

networks:
  traveling_like_a_root:
    external: true